<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#6c5ce7" />
  <meta name="description" content="Advanced 3D AI Chatbot powered by Groq API" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Fahxd_Core" />
  <link rel="apple-touch-icon"
    href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'><rect fill='%236c5ce7' width='180' height='180' rx='44'/><text x='50%' y='50%' font-size='90' fill='white' text-anchor='middle' dy='.35em' font-weight='bold'>⚡</text></svg>" />
  <link rel="manifest" href="/manifest.json" />
  <title>Fahxd_Core · 3D AI Chatbox</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,600;14..32,700&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: #0b0d15;
      overflow: hidden;
      height: 100vh;
      color: #f0f4ff;
    }

    #three-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    .chat-panel {
      position: fixed;
      bottom: 100px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 9;
      width: min(92%, 700px);
      max-height: 350px;
      overflow-y: auto;
      padding: 10px 20px;
      background: rgba(12, 15, 28, 0.3);
      backdrop-filter: blur(10px);
      border-radius: 24px;
      border: 1px solid rgba(255, 255, 255, 0.05);
      scroll-behavior: smooth;
      display: flex;
      flex-direction: column;
      gap: 8px;
      pointer-events: none;
    }

    .chat-panel::-webkit-scrollbar {
      width: 3px;
    }

    .chat-panel::-webkit-scrollbar-thumb {
      background: rgba(108, 92, 231, 0.4);
      border-radius: 10px;
    }

    .message {
      padding: 10px 16px;
      border-radius: 18px;
      max-width: 85%;
      font-size: 0.92rem;
      line-height: 1.5;
      animation: fadeIn 0.3s ease;
      pointer-events: auto;
      word-wrap: break-word;
      white-space: pre-wrap;
    }

    .message.user {
      align-self: flex-end;
      background: linear-gradient(135deg, #6c5ce7, #8b7cf7);
      color: white;
      border-bottom-right-radius: 4px;
    }

    .message.ai {
      align-self: flex-start;
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #f8fbff;
      font-weight: 600;
      border-bottom-left-radius: 4px;
    }

    .message.ai strong {
      color: #ffffff;
      font-weight: 700;
    }

    .message.error {
      align-self: flex-start;
      background: rgba(255, 0, 0, 0.15);
      border: 1px solid rgba(255, 0, 0, 0.2);
      color: #ff6b6b;
      border-bottom-left-radius: 4px;
    }

    .message .typing-indicator {
      display: flex;
      gap: 4px;
      padding: 4px 0;
    }

    .message .typing-indicator span {
      width: 8px;
      height: 8px;
      background: #a29bfe;
      border-radius: 50%;
      animation: typing 1.4s infinite;
    }

    .message .typing-indicator span:nth-child(2) {
      animation-delay: 0.2s;
    }

    .message .typing-indicator span:nth-child(3) {
      animation-delay: 0.4s;
    }

    @keyframes typing {

      0%,
      60%,
      100% {
        transform: translateY(0);
        opacity: 0.4;
      }

      30% {
        transform: translateY(-8px);
        opacity: 1;
      }
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(10px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .ui-overlay {
      position: fixed;
      bottom: 5%;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      width: min(92%, 700px);
      background: rgba(12, 15, 28, 0.55);
      backdrop-filter: blur(14px) saturate(180%);
      border-radius: 48px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 30px 60px -20px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(255, 255, 255, 0.02) inset;
      padding: 18px 18px 18px 28px;
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .ui-overlay input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: #f0f4ff;
      font-size: 1.05rem;
      font-weight: 400;
      letter-spacing: 0.3px;
      padding: 10px 0;
      min-width: 0;
    }

    .ui-overlay input::placeholder {
      color: rgba(255, 255, 255, 0.35);
      font-weight: 300;
    }

    .send-btn {
      background: linear-gradient(135deg, #6c5ce7, #a29bfe);
      border: none;
      border-radius: 40px;
      color: white;
      width: 52px;
      height: 52px;
      font-size: 1.3rem;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 6px 18px rgba(108, 92, 231, 0.35);
      flex-shrink: 0;
    }

    .send-btn:hover {
      transform: scale(1.05);
      box-shadow: 0 8px 28px rgba(108, 92, 231, 0.6);
    }

    .send-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    .mic-btn {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 40px;
      color: #d0d9f0;
      width: 52px;
      height: 52px;
      font-size: 1.1rem;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s ease;
      flex-shrink: 0;
      position: relative;
    }

    .mic-btn:hover {
      background: rgba(255, 255, 255, 0.1);
      color: #f0f4ff;
    }

    .mic-btn:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }

    .mic-btn.recording {
      background: linear-gradient(135deg, #ff5c5c, #ff8a8a);
      color: white;
      box-shadow: 0 0 0 0 rgba(255, 92, 92, 0.6);
      animation: mic-pulse 1.4s infinite;
    }

    @keyframes mic-pulse {
      0% {
        box-shadow: 0 0 0 0 rgba(255, 92, 92, 0.55);
      }

      70% {
        box-shadow: 0 0 0 14px rgba(255, 92, 92, 0);
      }

      100% {
        box-shadow: 0 0 0 0 rgba(255, 92, 92, 0);
      }
    }

    .menu-container {
      position: fixed;
      top: 28px;
      right: 28px;
      z-index: 20;
    }

    .menu-btn {
      background: rgba(10, 12, 26, 0.5);
      backdrop-filter: blur(10px);
      padding: 8px 16px;
      border-radius: 40px;
      border: 1px solid rgba(255, 255, 255, 0.06);
      font-size: 0.7rem;
      color: #a8b3d9;
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      box-shadow: 0 15px 30px -12px rgba(0, 0, 0, 0.6);
      transition: color 0.2s ease, background 0.2s ease;
    }

    .menu-btn:hover {
      color: #6c5ce7;
      background: rgba(108, 92, 231, 0.12);
    }

    .menu-btn.active {
      color: #6c5ce7;
      background: rgba(108, 92, 231, 0.15);
    }

    .dropdown-menu {
      position: absolute;
      top: 100%;
      right: 0;
      margin-top: 8px;
      background: rgba(12, 15, 28, 0.8);
      backdrop-filter: blur(10px);
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
      display: none;
      flex-direction: column;
      overflow: hidden;
      min-width: 140px;
    }

    .dropdown-menu.active {
      display: flex;
    }

    .dropdown-menu button {
      background: none;
      border: none;
      color: #a8b3d9;
      padding: 12px 18px;
      text-align: left;
      cursor: pointer;
      font-size: 0.75rem;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s ease;
    }

    .dropdown-menu button:hover {
      background: rgba(108, 92, 231, 0.12);
      color: #6c5ce7;
    }

    .dropdown-menu button:active {
      background: rgba(108, 92, 231, 0.18);
    }

    .dropdown-menu button i {
      font-size: 0.8rem;
    }

    .brand-badge {
      position: fixed;
      top: 28px;
      left: 28px;
      z-index: 20;
      background: rgba(10, 12, 26, 0.5);
      backdrop-filter: blur(10px);
      padding: 12px 26px 12px 22px;
      border-radius: 60px;
      border: 1px solid rgba(255, 255, 255, 0.06);
      display: flex;
      align-items: center;
      gap: 14px;
      box-shadow: 0 15px 30px -12px rgba(0, 0, 0, 0.6);
      pointer-events: none;
    }

    .brand-badge h1 {
      font-size: 1.6rem;
      font-weight: 600;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, #d0c9ff, #a29bfe);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .brand-badge .status {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.8rem;
      font-weight: 400;
      color: #a8b3d9;
      background: rgba(108, 92, 231, 0.15);
      padding: 4px 14px 4px 10px;
      border-radius: 40px;
      border: 1px solid rgba(162, 155, 254, 0.15);
    }

    .status-dot {
      width: 8px;
      height: 8px;
      background: #4ade80;
      border-radius: 50%;
      display: inline-block;
      box-shadow: 0 0 12px #4ade80aa;
      animation: pulse-dot 2s infinite;
    }

    @keyframes pulse-dot {

      0%,
      100% {
        opacity: 0.6;
        transform: scale(0.9);
      }

      50% {
        opacity: 1;
        transform: scale(1.2);
      }
    }

    .hint {
      position: fixed;
      bottom: 110px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 5;
      font-size: 0.8rem;
      color: rgba(255, 255, 255, 0.15);
      letter-spacing: 2px;
      font-weight: 300;
      text-transform: uppercase;
      background: rgba(0, 0, 0, 0.15);
      padding: 6px 18px;
      border-radius: 60px;
      backdrop-filter: blur(4px);
      border: 1px solid rgba(255, 255, 255, 0.02);
      pointer-events: none;
      white-space: nowrap;
    }

    .api-status {
      position: fixed;
      top: 28px;
      right: 28px;
      z-index: 20;
      background: rgba(10, 12, 26, 0.5);
      backdrop-filter: blur(10px);
      padding: 8px 18px;
      border-radius: 40px;
      border: 1px solid rgba(255, 255, 255, 0.06);
      font-size: 0.7rem;
      color: #4ade80;
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 15px 30px -12px rgba(0, 0, 0, 0.6);
      pointer-events: none;
    }

    .api-status i {
      font-size: 0.6rem;
    }

    .api-status.error {
      color: #ff6b6b;
    }

    @media (max-width: 600px) {
      .ui-overlay {
        padding: 12px 12px 12px 20px;
        border-radius: 36px;
        bottom: 4%;
      }

      .ui-overlay input {
        font-size: 0.95rem;
      }

      .send-btn {
        width: 46px;
        height: 46px;
        font-size: 1.1rem;
      }

      .mic-btn {
        width: 46px;
        height: 46px;
        font-size: 1rem;
      }

      .menu-container {
        top: 16px;
        right: 16px;
      }

      .menu-btn {
        padding: 6px 12px;
        font-size: 0.65rem;
      }

      .dropdown-menu button {
        padding: 10px 14px;
        font-size: 0.65rem;
      }

      .brand-badge {
        top: 16px;
        left: 16px;
        padding: 8px 18px 8px 16px;
        gap: 8px;
      }

      .brand-badge h1 {
        font-size: 1.2rem;
      }

      .brand-badge .status {
        font-size: 0.65rem;
        padding: 2px 10px 2px 8px;
      }

      .hint {
        bottom: 90px;
        font-size: 0.65rem;
        padding: 4px 14px;
      }

      .api-status {
        top: 16px;
        right: 16px;
        padding: 4px 12px;
        font-size: 0.6rem;
      }

      .chat-panel {
        bottom: 85px;
        max-height: 200px;
        padding: 8px 14px;
      }

      .message {
        font-size: 0.8rem;
        padding: 6px 12px;
      }
    }

    ::-webkit-scrollbar {
      width: 0;
    }
  </style>
</head>

<body>

  <div id="three-container"></div>

  <div class="brand-badge">
    <h1>⚡ Fahxd_Core</h1>
    <div class="status">
      <span class="status-dot"></span> online
    </div>
  </div>

  <div class="menu-container">
    <button class="menu-btn" id="menuBtn" title="Chat history menu">
      <i class="fas fa-ellipsis-v"></i> Menu
    </button>
    <div class="dropdown-menu" id="dropdownMenu">
      <button id="installAppBtn" title="Install app" style="display:none;">
        <i class="fas fa-download"></i> Install App
      </button>
      <button id="downloadHistoryBtn" title="Download chat history">
        <i class="fas fa-download"></i> Download
      </button>
      <button id="clearHistoryBtn" title="Clear chat history">
        <i class="fas fa-trash-can"></i> Clear
      </button>
    </div>
  </div>

  <div class="chat-panel" id="chatPanel">
    <div class="message ai">
      ⚡ Welcome to Fahxd_Core! Ask me anything!
    </div>
  </div>

  <div class="hint">✦ neural core · immersive 3D</div>

  <div class="ui-overlay">
    <input type="text" id="chatInput" placeholder="Ask Fahxd_Core anything..." autofocus />
    <button class="mic-btn" id="micBtn" title="Voice input">
      <i class="fas fa-microphone"></i>
    </button>
    <button class="send-btn" id="sendBtn">
      <i class="fas fa-arrow-up" style="transform: rotate(45deg);"></i>
    </button>
  </div>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.126.0/build/three.module.js"
      }
    }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'https://unpkg.com/three@0.126.0/examples/jsm/controls/OrbitControls.js';

    // --- 3D Scene Setup ---
    const container = document.getElementById('three-container');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0b0d15);

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 0.5, 7);
    camera.lookAt(0, 0, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    container.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.autoRotate = false;
    controls.enableZoom = true;
    controls.zoomSpeed = 0.8;
    controls.rotateSpeed = 0.8;
    controls.target.set(0, 0.2, 0);
    controls.enablePan = false;
    controls.maxPolarAngle = Math.PI / 2.2;
    controls.minPolarAngle = 0.2;

    // Lights
    const ambient = new THREE.AmbientLight(0x404066, 0.6);
    scene.add(ambient);

    const keyLight = new THREE.DirectionalLight(0xc8bfff, 1.2);
    keyLight.position.set(2, 3, 4);
    keyLight.castShadow = true;
    scene.add(keyLight);

    const fillLight = new THREE.DirectionalLight(0xffb8a0, 0.7);
    fillLight.position.set(-3, 1, 2);
    scene.add(fillLight);

    const rimLight = new THREE.DirectionalLight(0x6c5ce7, 0.9);
    rimLight.position.set(-1, 2, -5);
    scene.add(rimLight);

    const glowLight = new THREE.PointLight(0x7c6df0, 0.5, 10);
    glowLight.position.set(0.5, 1, 1.5);
    scene.add(glowLight);

    // Core Object
    const geometry = new THREE.IcosahedronGeometry(1.2, 2);
    const material = new THREE.MeshPhysicalMaterial({
      color: 0x6c5ce7,
      metalness: 0.15,
      roughness: 0.12,
      clearcoat: 0.9,
      clearcoatRoughness: 0.15,
      transparent: true,
      opacity: 0.92,
      emissive: 0x2a1f6b,
      emissiveIntensity: 0.18,
      envMapIntensity: 1.0,
      wireframe: false
    });
    const coreMesh = new THREE.Mesh(geometry, material);
    coreMesh.castShadow = true;
    coreMesh.receiveShadow = true;
    coreMesh.position.y = 0.2;
    scene.add(coreMesh);

    const wireframeMat = new THREE.MeshPhysicalMaterial({
      color: 0xa29bfe,
      emissive: 0x4a3b9e,
      emissiveIntensity: 0.25,
      wireframe: true,
      transparent: true,
      opacity: 0.25,
      roughness: 0.3,
      metalness: 0.1
    });
    const wireframeMesh = new THREE.Mesh(new THREE.IcosahedronGeometry(1.35, 1), wireframeMat);
    wireframeMesh.position.y = 0.2;
    scene.add(wireframeMesh);

    // Rings
    const ringGroup = new THREE.Group();
    ringGroup.position.y = 0.2;

    const ringMat = new THREE.MeshPhysicalMaterial({
      color: 0xa29bfe,
      emissive: 0x3d2f8a,
      emissiveIntensity: 0.2,
      metalness: 0.7,
      roughness: 0.25,
      transparent: true,
      opacity: 0.3,
      side: THREE.DoubleSide
    });

    const ring1 = new THREE.Mesh(new THREE.TorusGeometry(1.9, 0.025, 32, 64), ringMat);
    ring1.rotation.x = Math.PI / 2;
    ring1.rotation.z = 0.3;
    ringGroup.add(ring1);

    const ring2 = new THREE.Mesh(new THREE.TorusGeometry(1.7, 0.02, 24, 64), ringMat);
    ring2.rotation.y = 0.8;
    ring2.rotation.x = 0.7;
    ringGroup.add(ring2);

    const ring3 = new THREE.Mesh(new THREE.TorusGeometry(2.0, 0.015, 24, 64), ringMat);
    ring3.rotation.y = -0.5;
    ring3.rotation.z = 0.9;
    ringGroup.add(ring3);

    scene.add(ringGroup);

    // Particles
    const particleCount = 800;
    const particleGeo = new THREE.BufferGeometry();
    const positions = new Float32Array(particleCount * 3);
    const colors = new Float32Array(particleCount * 3);

    const color = new THREE.Color();

    for (let i = 0; i < particleCount; i++) {
      const r = 2.8 + Math.random() * 2.0;
      const theta = Math.random() * Math.PI * 2;
      const phi = Math.acos((Math.random() * 2) - 1);

      positions[i * 3] = Math.sin(phi) * Math.cos(theta) * r;
      positions[i * 3 + 1] = Math.sin(phi) * Math.sin(theta) * r * 0.6 + 0.2;
      positions[i * 3 + 2] = Math.cos(phi) * r;

      const hue = 0.7 + Math.random() * 0.2;
      const lightness = 0.5 + Math.random() * 0.5;
      color.setHSL(hue, 0.7, lightness);
      colors[i * 3] = color.r;
      colors[i * 3 + 1] = color.g;
      colors[i * 3 + 2] = color.b;
    }

    particleGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    particleGeo.setAttribute('color', new THREE.BufferAttribute(colors, 3));

    const particleMat = new THREE.PointsMaterial({
      size: 0.035,
      vertexColors: true,
      transparent: true,
      opacity: 0.7,
      blending: THREE.AdditiveBlending,
      sizeAttenuation: true
    });
    const particles = new THREE.Points(particleGeo, particleMat);
    scene.add(particles);

    // Animation
    function animate() {
      const elapsed = performance.now() / 1000;

      coreMesh.rotation.x = Math.sin(elapsed * 0.15) * 0.1;
      coreMesh.rotation.y += 0.0025;
      wireframeMesh.rotation.x = coreMesh.rotation.x;
      wireframeMesh.rotation.y = coreMesh.rotation.y;

      ringGroup.rotation.y += 0.0012;
      ringGroup.rotation.x = Math.sin(elapsed * 0.08) * 0.05;
      ringGroup.rotation.z += 0.0006;

      particles.rotation.y += 0.0002;
      particles.rotation.x = Math.sin(elapsed * 0.02) * 0.02;

      glowLight.position.x = Math.sin(elapsed * 0.5) * 0.8;
      glowLight.position.z = Math.cos(elapsed * 0.5) * 0.8;

      controls.update();
      renderer.render(scene, camera);
      requestAnimationFrame(animate);
    }

    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // --- CHAT FUNCTIONALITY ---
    const chatPanel = document.getElementById('chatPanel');
    const input = document.getElementById('chatInput');
    const sendBtn = document.getElementById('sendBtn');
    const micBtn = document.getElementById('micBtn');
    const menuBtn = document.getElementById('menuBtn');
    const dropdownMenu = document.getElementById('dropdownMenu');
    const clearHistoryBtn = document.getElementById('clearHistoryBtn');
    const downloadHistoryBtn = document.getElementById('downloadHistoryBtn');
    const apiStatus = document.getElementById('apiStatus');
    const API_BASE_URL = window.location.protocol === 'file:' ? 'http://localhost:3000' : window.location.origin;
    const HISTORY_KEY = 'fahxd_chat_history';
    const WELCOME_HTML = '⚡ Welcome to Fahxd_Core! Ask me anything — I will answer step by step.';

    function setApiStatus(text, isError = false) {
      apiStatus.innerHTML = `<i class="fas fa-key"></i> ${text}`;
      apiStatus.classList.toggle('error', isError);
    }

    // --- CHAT HISTORY (persisted in localStorage) ---

    function loadHistory() {
      try {
        const raw = localStorage.getItem(HISTORY_KEY);
        return raw ? JSON.parse(raw) : [];
      } catch {
        return [];
      }
    }

    function saveHistory(history) {
      try {
        localStorage.setItem(HISTORY_KEY, JSON.stringify(history));
      } catch {
        // storage unavailable (private mode, quota, etc.) — fail silently
      }
    }

    function renderHistory(history) {
      chatPanel.innerHTML = '';
      if (!history.length) {
        addMessage('ai', WELCOME_HTML, false);
        return;
      }
      history.forEach(entry => addMessage(entry.type, entry.content, false));
    }

    function restoreChatHistory() {
      const history = loadHistory();
      renderHistory(history);
    }

    function clearChatHistory() {
      saveHistory([]);
      renderHistory([]);
    }

    async function callGroq({ prompt }) {
      let response;

      try {
        response = await fetch(`${API_BASE_URL}/api/groq`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ prompt })
        });
      } catch (error) {
        throw new Error(`Could not reach the local AI server at ${API_BASE_URL}`);
      }

      if (!response.ok) {
        const errorData = await response.json().catch(() => ({}));
        throw new Error(errorData.error || `API request failed with status ${response.status}`);
      }

      const data = await response.json();
      return data.reply || '';
    }

    function escapeHtml(value) {
      return String(value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function formatMessageContent(content) {
      return escapeHtml(content)
        .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
        .replace(/\n/g, '<br>');
    }

    function addMessage(type, content, persist = true) {
      const msgDiv = document.createElement('div');
      msgDiv.className = `message ${type}`;

      if (type === 'ai' && content === 'typing') {
        msgDiv.innerHTML = `
          <div class="typing-indicator">
            <span></span><span></span><span></span>
          </div>
        `;
        msgDiv.id = 'typing-indicator';
      } else {
        msgDiv.innerHTML = formatMessageContent(content);
      }

      chatPanel.appendChild(msgDiv);
      chatPanel.scrollTop = chatPanel.scrollHeight;

      if (persist && !(type === 'ai' && content === 'typing')) {
        const history = loadHistory();
        history.push({ type, content });
        saveHistory(history);
      }

      return msgDiv;
    }

    function removeTypingIndicator() {
      const typing = document.getElementById('typing-indicator');
      if (typing) typing.remove();
    }

    function getFallbackReply(message, errorMessage = '') {
      const text = message.toLowerCase();

      if (text.includes('hello') || text.includes('hi')) {
        return '1. Hello! I am Fahxd_Core.\n2. I am ready to help you with questions, ideas, or coding tasks.';
      }

      if (text.includes('name')) {
        return '1. I am Fahxd_Core.\n2. I am your immersive AI assistant for chat and support.';
      }

      if (text.includes('what can you do') || text.includes('help')) {
        return '1. I can answer questions.\n2. I can help with ideas and planning.\n3. I can assist with coding and debugging.';
      }

      if (text.includes('code') || text.includes('html') || text.includes('javascript')) {
        return '1. I can help with coding questions.\n2. I can suggest simple implementations.\n3. I can help debug issues step by step.';
      }

      if (text.includes('weather') || text.includes('time')) {
        return '1. I am currently in fallback mode.\n2. I can still reply while the live AI service is unavailable.';
      }

      const detail = errorMessage ? `\n\nLive API note: ${errorMessage}` : '';
      return `1. Thanks for asking.\n2. I am replying from the built-in fallback mode so the chat stays active.\n3. I will keep the answer short and structured.${detail}`;
    }

    async function sendMessage() {
      const msg = input.value.trim();
      if (!msg) return;

      addMessage('user', msg);
      input.value = '';
      input.disabled = true;
      sendBtn.disabled = true;

      addMessage('ai', 'typing');

      try {
        console.log('Sending request to Groq API via local proxy...');
        const reply = await callGroq({ prompt: msg });
        removeTypingIndicator();

        if (!reply) {
          throw new Error('Groq returned an empty response');
        }

        setApiStatus('Groq online');
        addMessage('ai', reply);
      } catch (error) {
        removeTypingIndicator();
        console.error('Full Error:', error);
        setApiStatus('Fallback mode', true);
        addMessage('ai', getFallbackReply(msg, error?.message || 'Unknown error'));
      }

      input.disabled = false;
      sendBtn.disabled = false;
      input.focus();
    }

    sendBtn.addEventListener('click', sendMessage);
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') sendMessage();
    });

    // Menu toggle functionality
    menuBtn.addEventListener('click', () => {
      dropdownMenu.classList.toggle('active');
      menuBtn.classList.toggle('active');
    });

    // Close menu when clicking outside
    document.addEventListener('click', (e) => {
      const menuContainer = document.querySelector('.menu-container');
      if (!menuContainer.contains(e.target) && dropdownMenu.classList.contains('active')) {
        dropdownMenu.classList.remove('active');
        menuBtn.classList.remove('active');
      }
    });

    clearHistoryBtn.addEventListener('click', () => {
      if (confirm('Clear the entire chat history? This cannot be undone.')) {
        clearChatHistory();
        dropdownMenu.classList.remove('active');
        menuBtn.classList.remove('active');
      }
    });

    function downloadChatHistory(format = 'json') {
      const history = loadHistory();
      if (!history.length) {
        alert('No chat history to download.');
        return;
      }

      const timestamp = new Date().toLocaleString();
      let content, filename, type;

      if (format === 'json') {
        const data = {
          exported: timestamp,
          messages: history
        };
        content = JSON.stringify(data, null, 2);
        filename = `fahxd-chat-${Date.now()}.json`;
        type = 'application/json';
      } else if (format === 'txt') {
        let text = `FAHXD_CORE CHAT HISTORY\nExported: ${timestamp}\n${'='.repeat(50)}\n\n`;
        history.forEach((msg, idx) => {
          const sender = msg.type === 'user' ? 'YOU' : 'FAHXD_CORE';
          text += `[${idx + 1}] ${sender}:\n${msg.content}\n\n`;
        });
        content = text;
        filename = `fahxd-chat-${Date.now()}.txt`;
        type = 'text/plain';
      } else if (format === 'csv') {
        let csv = 'Type,Content,Timestamp\n';
        history.forEach(msg => {
          const escapedContent = `"${msg.content.replace(/"/g, '""')}"`;
          csv += `${msg.type},${escapedContent},${new Date().toISOString()}\n`;
        });
        content = csv;
        filename = `fahxd-chat-${Date.now()}.csv`;
        type = 'text/csv';
      }

      // Create blob and download
      const blob = new Blob([content], { type });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url;
      link.download = filename;
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      URL.revokeObjectURL(url);
    }

    downloadHistoryBtn.addEventListener('click', () => {
      // Create a simple format selector
      const format = confirm('Download as JSON? (Click Cancel for TXT)') ? 'json' : 'txt';
      downloadChatHistory(format);
      dropdownMenu.classList.remove('active');
      menuBtn.classList.remove('active');
    });

    // --- VOICE INPUT (Web Speech API) ---

    const SpeechRecognitionImpl = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognition = null;
    let isRecording = false;

    if (SpeechRecognitionImpl) {
      recognition = new SpeechRecognitionImpl();
      recognition.continuous = false;
      recognition.interimResults = true;
      recognition.lang = 'en-US';

      recognition.addEventListener('start', () => {
        isRecording = true;
        micBtn.classList.add('recording');
        micBtn.innerHTML = '<i class="fas fa-stop"></i>';
        input.placeholder = 'Listening...';
      });

      recognition.addEventListener('result', (event) => {
        let transcript = '';
        for (let i = 0; i < event.results.length; i++) {
          transcript += event.results[i][0].transcript;
        }
        input.value = transcript;

        if (event.results[event.results.length - 1].isFinal) {
          recognition.stop();
        }
      });

      recognition.addEventListener('error', (event) => {
        console.error('Speech recognition error:', event.error);
        setApiStatus(`Mic error: ${event.error}`, true);
      });

      recognition.addEventListener('end', () => {
        isRecording = false;
        micBtn.classList.remove('recording');
        micBtn.innerHTML = '<i class="fas fa-microphone"></i>';
        input.placeholder = 'Ask Fahxd_Core anything...';

        if (input.value.trim()) {
          sendMessage();
        }
      });

      micBtn.addEventListener('click', () => {
        if (isRecording) {
          recognition.stop();
        } else {
          input.value = '';
          try {
            recognition.start();
          } catch (err) {
            console.error('Could not start recognition:', err);
          }
        }
      });
    } else {
      micBtn.disabled = true;
      micBtn.title = 'Voice input not supported in this browser';
    }

    // --- INIT ---
    restoreChatHistory();
    setTimeout(() => input.focus(), 500);

    // --- PWA & SERVICE WORKER ---
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js')
        .then(reg => console.log('✅ Service Worker registered', reg))
        .catch(err => console.log('❌ Service Worker registration failed', err));
    }

    // Install App functionality
    let deferredPrompt;
    const installAppBtn = document.getElementById('installAppBtn');

    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      installAppBtn.style.display = 'flex';
    });

    installAppBtn.addEventListener('click', async () => {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        const { outcome } = await deferredPrompt.userChoice;
        console.log(`App installation ${outcome === 'accepted' ? 'accepted' : 'dismissed'}`);
        deferredPrompt = null;
        installAppBtn.style.display = 'none';
        dropdownMenu.classList.remove('active');
        menuBtn.classList.remove('active');
      }
    });

    window.addEventListener('appinstalled', () => {
      console.log('✅ App installed successfully');
      installAppBtn.style.display = 'none';
    });
  </script>
</body>

</html>
